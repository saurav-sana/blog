<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            background: #0d1117;
            color: #ffffff;
            font-family: 'IBM Plex Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 70px 80px;
            box-sizing: border-box;
            border-bottom: 8px solid #4fb8a6;
            position: relative;
            overflow: hidden;
        }

        /* Subtle background grid lines for a technical engineering feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .header, .content-grid, .footer {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .badge {
            background: #4fb8a6;
            color: #0d1117;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1.1rem;
        }
        .site-name {
            font-family: 'IBM Plex Mono', monospace;
            color: #8b949e;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
            gap: 50px;
            align-items: center;
        }

        .title-area h1 {
            font-family: 'Libre Franklin', sans-serif;
            font-size: 3.1rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            line-height: 1.12;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .title-area p {
            font-size: 1.3rem;
            color: #8b949e;
            margin: 0;
            line-height: 1.45;
        }

        /* Graphical Mini-Chart Container */
        .chart-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chart-header {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: #4fb8a6;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .mini-bar-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mini-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: #8b949e;
            width: 70px;
            text-align: right;
        }
        .mini-track {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.06);
            height: 14px;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }
        .mini-fill {
            height: 100%;
            border-radius: 3px;
        }
        .mini-fill.teal { background: #4fb8a6; }
        .mini-fill.amber { background: #d4a72c; }
        .mini-fill.grey { background: #64748b; }
        
        .mini-val {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: #ffffff;
            width: 45px;
            font-weight: 600;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'IBM Plex Mono', monospace;
            color: #4fb8a6;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .footer span {
            color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="badge">SS</div>
        <div class="site-name">Saurav Sana | Field Notes</div>
    </div>

    <div class="content-grid">
        <div class="title-area">
            <h1>The Monolith Crisis &amp; The 95% Reality</h1>
            <p>Breaking the MPP Default and validating the true shape of analytical workloads.</p>
        </div>

        <!-- Embedded Graphical Telemetry Card -->
        <div class="chart-box">
            <div class="chart-header">Query Volume vs Scan Size</div>
            
            <div class="mini-bar-row">
                <div class="mini-label">&lt; 1 GB</div>
                <div class="mini-track"><div class="mini-fill teal" style="width: 75%;"></div></div>
                <div class="mini-val">75%</div>
            </div>

            <div class="mini-bar-row">
                <div class="mini-label">1–10 GB</div>
                <div class="mini-track"><div class="mini-fill amber" style="width: 19%;"></div></div>
                <div class="mini-val">19%</div>
            </div>

            <div class="mini-bar-row">
                <div class="mini-label">&gt; 10 TB</div>
                <div class="mini-track"><div class="mini-fill grey" style="width: 6%;"></div></div>
                <div class="mini-val">~5%</div>
            </div>
        </div>
    </div>

    <div class="footer">
        Part 1 · Data Engineering & Architecture
        <span>October 2026</span>
    </div>
</body>
</html>
