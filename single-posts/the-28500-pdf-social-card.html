<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Thumbnail Preview Card - Clean & Complete Chart</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;0,6..72,800;1,6..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #05080C;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Public Sans', sans-serif;
        }

        /* EXACT 1.91:1 Social Card Dimension (1200x630 ratio) */
        .social-card {
            width: 1200px;
            height: 630px;
            background: #0B1016;
            border: 1px solid #1E2A3A;
            border-radius: 16px;
            padding: 72px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* Subtle background glow */
        .social-card::before {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(224, 92, 114, 0.04) 0%, rgba(11, 16, 22, 0) 70%);
            z-index: 1;
        }

        /* Main content split: Left text, Right complete chart */
        .card-content-grid {
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 50px;
            align-items: center;
            z-index: 2;
        }

        .card-title {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 64px;
            line-height: 1.05;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .card-title span {
            color: #E05C72;
        }

        .card-desc {
            font-size: 20px;
            line-height: 1.5;
            color: #94A3B8;
            font-family: 'Public Sans', sans-serif;
            max-width: 620px;
        }

        /* Complete Miniature Chart Preview Box */
        .mini-chart-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .mini-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #94A3B8;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .mini-chart-svg {
            width: 100%;
            height: 155px;
        }

        .chart-legend {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            border-top: 1px dashed #334155;
            padding-top: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #64748B;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="social-card">
        <!-- Body Content + Complete Embedded Chart Grid -->
        <div class="card-content-grid">
            <div>
                <h1 class="card-title">The $28,500 PDF <br><span>Nobody Read?</span></h1>
                <p class="card-desc">An empirical audit of corporate thought leadership, senior engineering opportunity costs, and the PR Decay Model of signal attenuation.</p>
            </div>

            <!-- Complete Data Chart Graphic (Figure 1.0 Trend Preview) -->
            <div class="mini-chart-card">
                <div class="mini-chart-header">
                    <span style="font-weight: 700; color: #F1F5F9;">FIG 1.0 &bull; LONGITUDINAL STAGNATION</span>
                    <span style="color: #E05C72; font-weight: 700;">15% FLATLINE</span>
                </div>
                
                <svg class="mini-chart-svg" viewBox="0 0 340 160" preserveAspectRatio="none">
                    <!-- Background Grid lines -->
                    <line x1="0" y1="30" x2="340" y2="30" stroke="#2A3B52" stroke-dasharray="3,3" stroke-width="1"/>
                    <line x1="0" y1="75" x2="340" y2="75" stroke="#2A3B52" stroke-dasharray="3,3" stroke-width="1"/>
                    <line x1="0" y1="120" x2="340" y2="120" stroke="#2A3B52" stroke-width="1"/>
                    
                    <!-- Y-Axis labels (implicit) -->
                    <text x="5" y="25" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">60%</text>
                    <text x="5" y="70" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">30%</text>
                    <text x="5" y="115" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">0%</text>

                    <!-- Trend Line 3: Mediocre / Poor (Gray dashed) -->
                    <polyline fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2,2" points="40,60 110,55 180,62 250,58 310,60"/>
                    
                    <!-- Trend Line 2: Good Baseline (Blue dashed) -->
                    <polyline fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4" points="40,45 110,48 180,42 250,45 310,43"/>
                    
                    <!-- Trend Line 1: Top Tier 15% Flatline (Crimson solid, bold) -->
                    <polyline fill="none" stroke="#E05C72" stroke-width="3.5" points="40,105 110,105 180,105 250,105 310,105"/>
                    
                    <!-- Data Points for Top Tier -->
                    <circle cx="40" cy="105" r="4" fill="#E05C72"/>
                    <circle cx="110" cy="105" r="4" fill="#E05C72"/>
                    <circle cx="180" cy="105" r="4" fill="#E05C72"/>
                    <circle cx="250" cy="105" r="4" fill="#E05C72"/>
                    <circle cx="310" cy="105" r="4" fill="#E05C72"/>
                </svg>

                <div class="chart-legend">
                    <div class="legend-item"><span class="legend-dot" style="background:#E05C72;"></span>Top Tier (15%)</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#60A5FA;"></span>Good Baseline</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#64748B;"></span>Mediocre/Poor</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
