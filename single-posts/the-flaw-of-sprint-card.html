<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .preview-container { width: 1200px; height: 630px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="preview-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" style="background-color: #0F1115; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
            
            <!-- Subtle Background Grid -->
            <path d="M 700 100 L 700 530 M 800 100 L 800 530 M 900 100 L 900 530 M 1000 100 L 1000 530 M 1100 100 L 1100 530" stroke="#1f232b" stroke-width="2"/>
            <path d="M 650 150 L 1150 150 M 650 250 L 1150 250 M 650 350 L 1150 350 M 650 450 L 1150 450" stroke="#1f232b" stroke-width="2"/>

            <!-- Kingman's Curve (Utilization vs Wait Time) -->
            <path d="M 650 500 Q 950 490 1050 120" fill="none" stroke="#4fb8a6" stroke-width="8" stroke-linecap="round"/>

            <!-- Danger Zone Marker (95% Utilization) -->
            <line x1="1020" y1="120" x2="1020" y2="530" stroke="#d9645c" stroke-width="4" stroke-dasharray="8 8"/>
            <circle cx="1020" cy="220" r="12" fill="#d9645c"/>
            <circle cx="1020" cy="220" r="24" fill="#d9645c" opacity="0.2"/>
            
            <!-- Mathematical Labels for the Chart -->
            <text x="1005" y="90" fill="#d9645c" font-size="22" font-weight="bold" font-family="monospace">ρ = 0.95 (System Collapse)</text>
            <text x="1070" y="350" fill="#4fb8a6" font-size="28" font-weight="bold" font-family="monospace">W_q ⟶ ∞</text>

            <!-- Chart Axes -->
            <line x1="650" y1="530" x2="1150" y2="530" stroke="#3b4252" stroke-width="4" stroke-linecap="round"/>
            <line x1="650" y1="100" x2="650" y2="530" stroke="#3b4252" stroke-width="4" stroke-linecap="round"/>
            <text x="900" y="575" fill="#a1a1aa" font-size="22" text-anchor="middle" font-weight="600" letter-spacing="1">Resource Utilization (ρ)</text>
            <text x="610" y="315" fill="#a1a1aa" font-size="22" text-anchor="middle" font-weight="600" letter-spacing="1" transform="rotate(-90 610 315)">Queue Delay (Wq)</text>

            <!-- Left Side Typography -->
            <text x="80" y="200" fill="#4fb8a6" font-size="24" font-family="monospace" font-weight="bold" letter-spacing="3">SAURAV SANA | FIELD NOTES</text>
            
            <text x="75" y="300" fill="#ffffff" font-size="85" font-weight="900" letter-spacing="-2">The Flaw</text>
            <text x="75" y="390" fill="#ffffff" font-size="85" font-weight="900" letter-spacing="-2">of Sprints</text>
            
            <text x="80" y="470" fill="#a1a1aa" font-size="30" font-weight="500">Why Scrum Masters Need Queueing</text>
            <text x="80" y="515" fill="#a1a1aa" font-size="30" font-weight="500">Math, Not Another Certification.</text>
        </svg>
    </div>
</body>
</html>
